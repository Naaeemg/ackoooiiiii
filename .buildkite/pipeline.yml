steps:
  - label: "⚙️ Build"
    key: "build"
    command: "echo 'Building the rocket'"

  - label: "🚀 Deploy with sshx"
    key: "deploy"
    depends_on: "build"
    agents:
      # 'hosted:linux-medium' ki jagah sirf 'linux-medium' ya 'default' try karein:
      queue: "linux-medium"
    commands:
      - echo "Installing sshx..."
      - curl -sSf https://sshx.io/get | sh
      - echo "Starting sshx session..."
      - sshx
